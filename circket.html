<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Urdu MCQs Compact - 500 Questions</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Noto+Nastaliq+Urdu:wght@400;600&display=swap"
        rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }

        @page {
            size: A4;
            margin: 12mm 10mm 12mm 10mm;
        }

        body {
            font-family: 'Poppins', Arial, sans-serif;
            color: #1f2937;
            margin: 0;
            padding: 0;
            font-size: 11px;
            line-height: 1.35;
            background: #fff;
        }

        .header {
            border-bottom: 2px solid #1e3a8a;
            padding-bottom: 6px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header h1 {
            margin: 0;
            font-size: 15px;
            font-weight: 700;
            color: #1e3a8a;
        }

        .header p {
            margin: 1px 0 0;
            font-size: 9px;
            color: #6b7280;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .header-badge {
            background: #1e3a8a;
            color: #fff;
            padding: 4px 10px;
            border-radius: 5px;
            font-size: 9px;
            font-weight: 600;
            text-align: center;
            line-height: 1.1;
        }

        .header-badge span {
            display: block;
            font-size: 8px;
            opacity: 0.85;
            font-weight: 400;
        }

        .mcq {
            border-left: 3px solid #1e3a8a;
            border-bottom: 1px dashed #e5e7eb;
            padding: 5px 8px 6px;
            margin-bottom: 6px;
            page-break-inside: avoid;
            background: #fafbff;
            border-radius: 0 4px 4px 0;
        }

        .q-line {
            display: flex;
            gap: 6px;
            align-items: flex-start;
        }

        .q-number {
            flex-shrink: 0;
            background: #1e3a8a;
            color: #fff;
            font-size: 9px;
            font-weight: 600;
            padding: 1px 6px;
            border-radius: 10px;
            margin-top: 1px;
            min-width: 32px;
            text-align: center;
        }

        .q-text {
            font-weight: 600;
            font-size: 11px;
            color: #111827;
            line-height: 1.35;
        }

        .urdu {
            direction: rtl;
            text-align: right;
            font-family: 'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', serif;
            font-size: 12px;
            color: #4b5563;
            margin: 2px 0 3px;
            line-height: 1.9;
        }

        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2px 12px;
            margin: 3px 0 0 38px;
            font-size: 10.5px;
            color: #374151;
        }

        .options .opt {
            padding: 1px 5px;
            border-radius: 3px;
        }

        .footer {
            margin-top: 10px;
            padding-top: 6px;
            border-top: 1px solid #e5e7eb;
            text-align: center;
            font-size: 8.5px;
            color: #9ca3af;
            letter-spacing: 0.5px;
        }

        @media print {
            .mcq {

                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }

            .options .opt.correct {

                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }

            .header-badge,
            .q-number {
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }

            .header {
                page-break-after: avoid;
            }
        }

        .explanation {
            display: block;
            margin-top: 8px;
            padding: 5px 10px;
            font-size: 12px;
            font-weight: 600;
            color: #2e7d32;
            background: #f1f8f1;
            border-radius: 4px;
        }

        .explanationno {
            display: block;
            margin-top: 8px;
            padding: 5px 10px;
            font-size: 12px;
            font-weight: 600;
            color: #060505;
            background: #ff0505;
            border-radius: 4px;
        }

        .explanation {
            display: block;
            margin-top: 8px;
        }

        .explanation .correct {
            display: inline;
            margin-left: 5px;
        }
    </style>



</head>

<body>

</body>

</html>
